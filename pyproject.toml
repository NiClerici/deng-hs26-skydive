[project]
name = "deng-hs26-skydive"
version = "0.1.0"
description = "Batch pipeline that scores whether skydiving is possible per Swiss dropzone and hour"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "numpy>=2.5.3",
    "openmeteo-requests>=1.7.5",
    "opensky-api",
    "pandas>=3.0.6",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
]

[tool.uv.sources]
opensky-api = { git = "https://github.com/openskynetwork/opensky-api.git", subdirectory = "python" }
