# Local stack: PostgreSQL + pgAdmin + Python ingestion container.
# Run from the repo root:
#   docker compose -f storage/docker-compose.yml up -d postgres pgadmin   (pgAdmin: http://localhost:5050)
#   docker compose -f storage/docker-compose.yml run --rm ingestion python script/meteo_past.py
# Credentials come from ../.env (see .env.example), nothing is hardcoded here.

name: skydive

services:
  postgres:
    image: postgres:17
    env_file: ../.env  # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro #docker-entrypoint-initdb.d is a path from docker that executes scripts on first container start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [skydive]

  ingestion:
    build:
      context: ..
      dockerfile: storage/Dockerfile
    env_file: ../.env  # OpenSky CLIENT_ID / CLIENT_SECRET + Postgres credentials
    environment:
      POSTGRES_HOST: postgres  # service name on the compose network
      POSTGRES_PORT: 5432
    volumes:
      - ../data:/app/data  # CSV output lands on the host
      - ./scripts:/app/storage/scripts:ro  # load scripts, edits apply without rebuilding
    depends_on:
      postgres:
        condition: service_healthy
    networks: [skydive]
    command: ["sh", "-c", "python script/meteo_past.py && python script/meteo_forecast.py"]

  pgadmin:
    image: dpage/pgadmin4:9
    env_file: ../.env  # PGADMIN_DEFAULT_EMAIL, PGADMIN_DEFAULT_PASSWORD
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro  # pre-registers the postgres service
      - pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks: [skydive]

volumes:
  pgdata:
  pgadmin:

networks:
  skydive:
