# Local stack: PostgreSQL + Python ingestion container.
# Run from the repo root:
#   docker compose -f storage/docker-compose.yml up -d postgres
#   docker compose -f storage/docker-compose.yml run --rm ingestion python script/meteo_past.py
# Credentials come from ../.env (see .env.example), nothing is hardcoded here.

name: skydive

services:
  postgres:
    image: postgres:17
    env_file: ../.env  # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [skydive]

  ingestion:
    build:
      context: ..
      dockerfile: storage/Dockerfile
    env_file: ../.env  # OpenSky CLIENT_ID / CLIENT_SECRET + Postgres credentials
    environment:
      POSTGRES_HOST: postgres  # service name on the compose network
      POSTGRES_PORT: 5432
    volumes:
      - ../data:/app/data  # CSV output lands on the host
    depends_on:
      postgres:
        condition: service_healthy
    networks: [skydive]
    command: ["sh", "-c", "python script/meteo_past.py && python script/meteo_forecast.py"]

volumes:
  pgdata:

networks:
  skydive:
